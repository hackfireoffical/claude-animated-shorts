name: Render short

on:
  workflow_dispatch:
    inputs:
      mode:
        description: still = one frame (fast test), render = full video in parallel chunks
        type: choice
        options: [still, render]
        default: still
      frame:
        description: Frame number for still mode
        default: "100"
      chunks:
        description: Parallel jobs for render mode (max 20 on the free plan)
        default: "8"
      scale:
        description: 0.5 test, 1 = 1080x1920, 1.3333 = 2K final
        default: "0.5"
      concurrency:
        description: Browser tabs per job
        default: "2"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        env:
          MODE: ${{ inputs.mode }}
          FRAME: ${{ inputs.frame }}
          CHUNKS: ${{ inputs.chunks }}
        run: |
          TOTAL=$(grep -oP 'TOTAL = \K[0-9]+' templates/bridge/story.ts | head -1)
          export TOTAL
          MATRIX=$(python3 - <<'PY'
          import json, math, os
          total = int(os.environ["TOTAL"])
          if os.environ["MODE"] == "still":
              f = int(os.environ["FRAME"])
              m = [{"idx": "00", "a": f, "b": f}]
          else:
              n = max(1, min(20, int(os.environ["CHUNKS"])))
              size = math.ceil(total / n)
              m = []
              for i in range(n):
                  a = i * size
                  if a > total - 1:
                      break
                  m.append({"idx": f"{i:02d}", "a": a, "b": min(total - 1, a + size - 1)})
          print(json.dumps({"include": m}, separators=(",", ":")))
          PY
          )
          echo "total frames: $TOTAL"
          echo "$MATRIX"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev \
            libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 \
            libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2

      - name: Assemble Remotion project
        run: |
          mkdir -p proj/src/videos proj/public/bridge/kenney
          cp ci/package.json proj/
          cp -r ci/src/. proj/src/
          cp -r templates/bridge proj/src/videos/bridge
          if [ -d ci/public ]; then cp -r ci/public/. proj/public/; fi

      - name: Install
        working-directory: proj
        run: |
          npm install --legacy-peer-deps
          npx remotion browser ensure

      - name: Render
        working-directory: proj
        env:
          MODE: ${{ inputs.mode }}
          IDX: ${{ matrix.idx }}
          A: ${{ matrix.a }}
          B: ${{ matrix.b }}
          SCALE: ${{ inputs.scale }}
          CONC: ${{ inputs.concurrency }}
        run: |
          set -e
          mkdir -p ../out
          if [ "$MODE" = "still" ]; then
            npx remotion still src/index.ts BridgeShort "../out/still_$A.png" \
              --frame="$A" --scale="$SCALE" --gl=swangle --timeout=300000
          else
            npx remotion render src/index.ts BridgeShort "../out/part_$IDX.mp4" \
              --codec=h264 --crf=16 --scale="$SCALE" --gl=swangle \
              --concurrency="$CONC" --timeout=300000 --muted --frames="$A-$B"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.idx }}
          path: out/
          if-no-files-found: error
          retention-days: 1

  assemble:
    needs: render
    if: ${{ inputs.mode == 'render' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: part-*
          merge-multiple: true
          path: parts

      - name: Concat (and mux audio if ci/audio/mix.wav exists)
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          mkdir -p out
          cd parts
          for f in $(ls part_*.mp4 | sort); do echo "file '$f'" >> list.txt; done
          cat list.txt
          ffmpeg -y -f concat -safe 0 -i list.txt -c copy ../out/video.mp4
          cd ..
          if [ -f ci/audio/mix.wav ]; then
            ffmpeg -y -i out/video.mp4 -i ci/audio/mix.wav -map 0:v:0 -map 1:a:0 \
              -c:v copy -c:a aac -b:a 192k -shortest out/final.mp4
          fi
          ffprobe -v error -show_entries format=duration:stream=nb_frames -of default=nw=1 out/video.mp4

      - uses: actions/upload-artifact@v4
        with:
          name: short
          path: out/
          if-no-files-found: error
          retention-days: 7
